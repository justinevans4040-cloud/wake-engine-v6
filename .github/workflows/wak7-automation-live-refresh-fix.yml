name: WAK-7 Automation Live Refresh Fix

on:
  push:
    branches:
      - agent/wak-7-claim-verification

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[wak7-automation-live-refresh-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wak-7-claim-verification
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/wak7-automation-live-refresh-fix.mjs
      - name: Validate exact UI freshness fix
        run: |
          git diff --check
          grep -Fq 'window.setInterval(() => {' src/main.jsx
          grep -Fq 'Promise.resolve(onRefresh()).catch' src/main.jsx
          grep -Fq '}, 2500);' src/main.jsx
      - name: Commit fix and remove one-shot machinery
        run: |
          git config user.name "wake-engine-ci"
          git config user.email "actions@users.noreply.github.com"
          git rm scripts/wak7-automation-live-refresh-fix.mjs .github/workflows/wak7-automation-live-refresh-fix.yml
          git add src/main.jsx
          git commit -m "WAK-7: keep Automations synchronized with scheduler state [wak7-automation-live-refresh-done]"
          git push origin HEAD:agent/wak-7-claim-verification
