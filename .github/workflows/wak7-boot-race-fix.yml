name: WAK-7 Boot Race Fix

on:
  push:
    branches:
      - agent/wak-7-claim-verification

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[wak7-boot-race-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wak-7-claim-verification
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/wak7-boot-race-fix.mjs
      - name: Validate exact harness fix
        run: |
          git diff --check
          grep -Fq 'const boot = page.locator(".boot")' scripts/route-ui-audit.mjs
          grep -Fq 'if (bootStillVisible) throw error;' scripts/route-ui-audit.mjs
      - name: Commit fix and remove one-shot machinery
        run: |
          git config user.name "wake-engine-ci"
          git config user.email "actions@users.noreply.github.com"
          git rm scripts/wak7-boot-race-fix.mjs .github/workflows/wak7-boot-race-fix.yml
          git add scripts/route-ui-audit.mjs
          git commit -m "WAK-7: tolerate boot overlay reload race [wak7-boot-race-done]"
          git push origin HEAD:agent/wak-7-claim-verification
