name: WAKE Engine CI

on:
  push:
    branches:
      - master
      - "agent/**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wak7-refresh-repair:
    name: WAK-7 one-time refresh repair
    if: github.event_name == 'push' && github.ref == 'refs/heads/agent/wak-7-complete-fix'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out corrective branch
        uses: actions/checkout@v4
        with:
          ref: agent/wak-7-complete-fix
          fetch-depth: 0

      - name: Repair Automations refresh callback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/main.jsx')
          text = path.read_text(encoding='utf-8')
          old = '              onRefresh={fetchState} '
          new = '              onRefresh={refresh} '
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one fetchState Automations wiring, found {text.count(old)}')
          text = text.replace(old, new, 1)
          if 'fetchState' in text:
              raise SystemExit('fetchState reference still remains in src/main.jsx')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit source repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx
          git diff --cached --check
          git commit -m "fix: wire Automations to live state refresh"
          git push origin HEAD:agent/wak-7-complete-fix

  portable-verification:
    name: Portable verification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and audit portable runtime
        run: npm run verify:portable

  windows-installer:
    name: Windows installer and desktop verification
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit all UI routes and controls
        run: npm run audit:ui

      - name: Build and audit portable runtime
        run: npm run verify:portable

      - name: Build NSIS installer
        run: npm run package:installer

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw "No Windows installer was produced in release/." }
          $hash = (Get-FileHash -Path $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Path release/SHA256SUMS.txt -Encoding ascii
          Get-Content release/SHA256SUMS.txt

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: wake-engine-v6-windows-installer
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  security:
    name: Dependency and repository secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
