name: WAK-7 Test Normalize

on:
  push:
    branches:
      - agent/wak-7-claim-verification

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[wak7-test-normalize-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wak-7-claim-verification
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/wak7-test-normalize.mjs
      - run: git diff --check
      - name: Commit exact test repair and remove one-shot files
        run: |
          git config user.name "wake-engine-ci"
          git config user.email "actions@users.noreply.github.com"
          git rm scripts/wak7-test-normalize.mjs .github/workflows/wak7-test-normalize.yml
          git add scripts/route-ui-audit.mjs
          git commit -m "WAK-7: normalize markdown in unsupported-capability assertion [wak7-test-normalize-done]"
          git push origin HEAD:agent/wak-7-claim-verification
