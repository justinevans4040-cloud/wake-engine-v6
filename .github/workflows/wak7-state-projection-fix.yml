name: WAK-7 State Projection Fix

on:
  push:
    branches:
      - agent/wak-7-claim-verification

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[wak7-state-projection-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wak-7-claim-verification
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/wak7-state-projection-fix.mjs
      - name: Validate exact state contract fix
        run: |
          git diff --check
          grep -Fq 'automations: store.automations.slice(0, 200)' server/index.js
          grep -Fq 'automationRuns: store.automationRuns.slice(0, 200)' server/index.js
          grep -Fq 'reviewQueue: store.reviewQueue.slice(0, 100)' server/index.js
      - name: Commit fix and remove one-shot machinery
        run: |
          git config user.name "wake-engine-ci"
          git config user.email "actions@users.noreply.github.com"
          git rm scripts/wak7-state-projection-fix.mjs .github/workflows/wak7-state-projection-fix.yml
          git add server/index.js
          git commit -m "WAK-7: expose Automation persisted state to UI [wak7-state-projection-done]"
          git push origin HEAD:agent/wak-7-claim-verification
