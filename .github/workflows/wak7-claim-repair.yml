name: WAK-7 Claim Repair

on:
  push:
    branches:
      - agent/wak-7-claim-verification

permissions:
  contents: write

jobs:
  apply-repair:
    if: ${{ !contains(github.event.head_commit.message, '[wak7-repair-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wak-7-claim-verification
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact repair
        run: node scripts/wak7-claim-repair.mjs
      - name: Validate patch shape
        run: |
          git diff --check
          grep -q 'Open \*\*Monitor\*\*' server/index.js
          ! grep -q '\*\*Inbox\*\*' server/index.js
      - name: Remove one-shot repair machinery and commit
        run: |
          git config user.name "wake-engine-ci"
          git config user.email "actions@users.noreply.github.com"
          git rm scripts/wak7-claim-repair.mjs .github/workflows/wak7-claim-repair.yml
          git add server/index.js
          git commit -m "WAK-7: ground Instructions in implemented surfaces [wak7-repair-done]"
          git push origin HEAD:agent/wak-7-claim-verification
