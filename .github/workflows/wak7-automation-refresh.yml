name: WAK-7 automation refresh patch

on:
  push:
    branches:
      - agent/wak-7-complete-fix
    paths:
      - .github/workflows/wak7-automation-refresh.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wak-7-complete-fix
          fetch-depth: 0

      - name: Correct Automations refresh callback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/main.jsx')
          text = path.read_text(encoding='utf-8')
          old = '              onRefresh={fetchState} '
          new = '              onRefresh={refresh} '
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one fetchState Automations wiring, found {text.count(old)}')
          text = text.replace(old, new, 1)
          if 'fetchState' in text:
              raise SystemExit('fetchState reference still remains in src/main.jsx')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Self-remove and commit
        shell: bash
        run: |
          rm .github/workflows/wak7-automation-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx .github/workflows/wak7-automation-refresh.yml
          git diff --cached --check
          git commit -m "fix: wire Automations to live state refresh"
          git push origin HEAD:agent/wak-7-complete-fix
